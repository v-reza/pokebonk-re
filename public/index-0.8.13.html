      const dirToFace = d => { const a = ((d / 8) * Math.PI * 2) - Math.PI; return { x: Math.sin(a), z: Math.cos(a) }; };

      function gameAdapter() {
        const runOf = () => R.run;
        return {
          // host: team stats for the k:'f' frame
          team() {
            const r = runOf(), p = r && r.player;
            return {
              time: r ? r.time : 0, level: p ? p.level : 1, xp: p ? p.xp : 0,
              xpNext: p ? (p.xpNext || 1) : 1, kills: r ? r.stats.kills : 0,
              bosses: r ? r.stats.bosses : 0, coins: r ? r.gold : 0,
              stage: r ? r.stage : 1, stageTime: r ? r.stageTime : 0,
              migrations: r ? r.migrations | 0 : 0, floor: r ? towerKey(r) : 0
            };
          },
          // host: enemy wire rows near THAT guest (its puppet = its last frame)
          enemyList(m) {
            const r = runOf(); if (!r) return [];
            const v = m && m.pl, n = v && v.net;
            const x = v && v.pos ? v.pos.x : n ? n.x : r.player.pos.x;
            const z = v && v.pos ? v.pos.z : n ? n.y : r.player.pos.z;
            // Straight into wire rows (no intermediate objects: 300 enemies x 15 Hz
            // x every guest was a lot of garbage).
            const sd = r.enemies, out = [], r2n = NEAR_R * NEAR_R;
            for (let i = 0; i < sd.n; i++) {
              if (!sd.alive[i] || sd.dying[i] > 0) continue;
              const dx = sd.x[i] - x, dz = sd.z[i] - z;
              if (dx * dx + dz * dz > r2n) continue;
              const fx = sd.fx[i], fz = sd.fz[i];
              out.push([i, r2(sd.x[i]), r2(sd.z[i]), Math.ceil(sd.hp[i]),
                sd.atkAnim[i] > 0 ? 1 : (sd.frozen[i] > 0 || sd.sleep[i] > 0) ? 2 : 0,
                dirOfXZ(fx, fz),
                (sd.burn[i] > 0 ? 1 : 0) | (sd.poison[i] > 0 ? 2 : 0) | (sd.shield[i] > 0 ? 4 : 0) | (sd.hazSlow[i] < 1 ? 8 : 0)]);
            }
            return out;
          },
          // host: every live enemy as 'ne', for a guest that has just come in
          enemySnapshot() {
            const r = runOf(); if (!r) return [];
            const sd = r.enemies, out = [];
            for (let i = 0; i < sd.n; i++) if (sd.alive[i] && !sd.remote[i] && sd.dying[i] <= 0) out.push(enemyEvent(sd, i));
            return out;
          },
          // guest: remote enemy lifecycle ('ne' / 'ed' / 'eg' / 'f' rows).
          // The host's slot index and the guest's local slot index are NOT the
          // same: `sd.spawn()` pops from the guest's own free list. The wire
          // protocol (and every 'h' hit the guest sends back) speaks HOST slot
          // ids, so `hostSlot[localSlot]` is the mapping used on both sides.
          addRemoteEnemy(ev) {
            const r = runOf(); if (!r) return;
            const sd = r.enemies;
            const hostSlot = ev[1];
            // Idempotent: the join snapshot can repeat an enemy we already have.
            const known = localSlotOf(hostSlot);
            if (known != null) {
              if (sd.species[known] === ev[2]) return;
              sd.kill(known);       // that host slot was reused by a new enemy
            }
            const slot = sd.spawn(ev[2], ev[3], ev[4], 1, 1, ev[9] || 0);
            if (slot < 0) return;
            sd.remote[slot] = 1;
            (sd.hostSlot ||= new Int32Array(sd.remote.length))[slot] = hostSlot;
            sd.maxHp[slot] = sd.hp[slot] = ev[7] || 1;
            const b = slot * 4;
            sd.net[b] = ev[3]; sd.net[b + 1] = ev[4]; sd.net[b + 2] = ev[7] || 1; sd.net[b + 3] = 0;
            if (sd.netV) sd.netV[slot * 2] = sd.netV[slot * 2 + 1] = 0;
          },
          applyRemoteEnemy(a) {
            const r = runOf(); if (!r) return;
            const sd = r.enemies;
            // a[0] is a HOST slot; translate to the guest's local row.
            const local = r.coop ? r.coop.localSlotOf(a[0]) : a[0];
            if (local == null || !sd.alive[local]) return;
            const b = local * 4, now = performance.now();
            const v = sd.netV || (sd.netV = new Float32Array(sd.remote.length * 2));
            const dts = (now - sd.net[b + 3]) / 1000;
            if (dts > 0.02 && dts < 1.5) {
              v[local * 2] = Math.max(-15, Math.min(15, (a[1] - sd.net[b]) / dts));
              v[local * 2 + 1] = Math.max(-15, Math.min(15, (a[2] - sd.net[b + 1]) / dts));
            } else { v[local * 2] = v[local * 2 + 1] = 0; }
            sd.net[b] = a[1]; sd.net[b + 1] = a[2]; sd.net[b + 2] = a[3]; sd.net[b + 3] = now;
            const anim = a[4], dir = a[5];
            sd.atkAnim[local] = anim === 1 ? 0.2 : 0;
            sd.dying[local] = anim === 3 ? 0.1 : 0;
            sd.frozen[local] = anim === 2 ? 1 : 0;
            sd.sleep[local] = 0;
            const f = dirToFace(dir || 0);
            sd.fx[local] = f.x; sd.fz[local] = f.z;
            if (a[6] & 1) sd.burn[local] = Math.max(sd.burn[local], 0.1);
            if (a[6] & 2) sd.poison[local] = Math.max(sd.poison[local], 0.1);
          },
          removeRemoteEnemy(hostSlot) {
            const r = runOf(); if (!r) return;
            const local = r.coop ? r.coop.localSlotOf(hostSlot) : hostSlot;
            if (local != null && r.enemies.remote[local]) r.enemies.kill(local);
          },
          // guest: damage-number popup on a remote enemy ('hn' event)
          showRemoteHurt(hostSlot, dmg, color) {
            const r = runOf(); if (!r) return;
            const sd = r.enemies;
            const slot = r.coop ? r.coop.localSlotOf(hostSlot) : hostSlot;
            if (slot == null || !sd || !sd.alive || !sd.alive[slot]) return;
            r.vfx.number(sd.x[slot], sd.y[slot] + sd.hgt[slot] + 0.3, sd.z[slot], dmg, color || 16777215);
            sd.flash[slot] = 1;
          },
          // host: apply a guest's forwarded hit
          getEnemy(slot) { const r = runOf(); return r && r.enemies.isAlive(slot) ? slot : null; },
          // host: apply a guest's forwarded hit.
          // `silent: true` is REQUIRED: without it the host runs the local
          // damage-number/audio block, which needs a move definition for
          // `n.slot` that a forwarded hit does not have, throws, and skips the
          // `i.hp[e] <= 0 && this.killEnemy(e, n)` tail — damage lands but the
          // enemy never dies (observed: host hp 30 -> 8.6, kills stayed 0).
          // The guest already applied its stats/type chart (bundle patch A11), so
          // `dmg` is final. The host draws the teammate's number itself (silent
          // skips the bundle's own one, see above).
          applyHit(slot, dmg, color, dx, dy, knock) {
            const r = runOf(); if (!r) return;
            const sd = r.enemies, x = sd.x[slot], y = sd.y[slot] + sd.hgt[slot] + 0.3, z = sd.z[slot];
            const done = r.combat.hit(slot, num(dmg, 0, 0, 1e9), {
              fixed: true, silent: true, dirX: num(dx, 0, -1, 1), dirZ: num(dy, 0, -1, 1), knock: num(knock, 1.5, 0, 10),
            });
            if (done > 0) r.vfx.number(x, y, z, done, color || 16777215);
          },
          applyStatus(slot, kind, val) { const r = runOf(); if (r && r.combat.applyStatus) r.combat.applyStatus(slot, kind, val); },
          ghostCast() { /* TODO(no game API): no hook to render a teammate's ghost cast. */ },
          // UI / flow
          // guest: host frame drives the HUD team stats + clock (host runs the world).
          syncTeam(s) {
            const r = runOf(); if (!r || !r.player) return;
            const p = r.player;
            if (s.time != null) r.time = s.time;
            if (s.level != null) p.level = s.level;
            if (s.xp != null) p.xp = s.xp;
            if (s.xpNext != null) p.xpNext = s.xpNext;
            if (s.kills != null) r.stats.kills = s.kills;
            if (s.bosses != null) r.stats.bosses = s.bosses;
            // Team purse: the host's. What WE changed since the last frame (shop,
            // slots, rocks...) goes to the host, which applies it to the purse;
            // until its next frame shows it, we keep showing our change.
            if (s.coins != null) {
              if (R.goldSeen != null && r.coop && r.coop.active && !r.coop.isHost) {
                const d = r2(r.gold - R.goldSeen);
                if (d) r.coop.toHost(['gd', d]);
                r.gold = s.coins + d;
              } else r.gold = s.coins;
              R.goldSeen = r.gold;
            }
            // The zone clock (HUD timer, final swarm) is the host's too.
            if (s.stageTime != null && r.stage === s.stage) r.stageTime = s.stageTime;
            // The host went through the portal: follow it into the same zone.
            // Zones are built from seed + stage, and both runs share the seed.
            // Same for endless migrations and tower floors. A downed guest is
            // stood up first: the bundle refuses to travel with a dead player.
            const follow = (fn) => {
              if (r.state !== 'play') return;
              if (r.player.dead) standUp(r, 0.3);
              fn().catch(e => console.warn('[coop] follow host', e));
            };
            if (Number.isInteger(s.stage) && s.stage > r.stage && !r.endless && !r.tower) {
              follow(() => { r.stage = s.stage - 1; return r.enterPortal(); });
            } else if (r.endless && Number.isInteger(s.migrations) && s.migrations > (r.migrations | 0)) {
              follow(() => { r.migrations = s.migrations - 1; return r.migrate(); });
            } else if (r.tower && Number.isInteger(s.floor) && s.floor > towerKey(r)) {
              follow(() => r.climb());
            }
          },
          levelStart(lv) {
            // Host: doLevelUp() already opens the card natively and the bundle
            // hook broadcasts the 'lu' event.
            //
            // Guest: as in PokéSurvivor, everyone picks their OWN card on a team
            // level-up. Queue it like a local level-up: DC.update opens it through
            // the bundle's own doLevelUp() path on the next 'play' frame, and its
            // close hook (bundle patch A6 -> __pbLevelPicked) sends 'lp'. (Calling
            // ui.showLevelUp() directly from here is what used to blow up.)
            const r = runOf();
            if (!r || !r.coop || r.coop.isHost || r.state === 'over') return;
            r.queueLevelUp();
            // Held after our last card? The new card can only open in 'play'.
            if (R.holding) release(r);
          },
          // 'lr' (guest) / everyone picked (host): let the run go on.
          resume() {
            const r = runOf();
            if (!r || !R.holding) return;
            release(r);
          },
          waiting(names) {
            const r = runOf();
            if (!r || !r.ui) return;
            const others = (names || []).filter(n => n !== 'You' && n !== 'Tú' && n !== (r.player && r.player.uid));
            R.waitNames = others;
            if (R.holding) { showWaitPanel(r); return; }   // our card is done: the panel says it
            const k = others.join(',');
            if (k === (R._waitKey || null)) return;   // debounce sendWaiting() repeats
            R._waitKey = k;
            if (others.length) r.ui.toast(`Waiting for: ${others.join(', ')}`, null);
          },
          over(d) {
            const r = runOf();
            if (!r || r.state === 'over') return;
            r.endHow = d && d.why ? d.why : 'lose';
            try { r.finish((d && d.why) === 'win'); } catch (e) { console.warn('[coop] over', e); }
          },
          // The host owns the enemies and the clock: without it a guest's world
          // is empty and frozen, so the run ends (PokéSurvivor does the same).
          lost(msg) {
            console.warn('[coop]', msg);
            const r = runOf();
            if (!r || r.state === 'over') return;
            showDcBanner('Lost connection to the host — the run has ended');
            if (r.ui) r.ui.toast('Lost connection to the host', null);
            setTimeout(() => {
              if (r.state === 'over') return;
              r.endHow = 'lose';
              try { r.finish(false); } catch (e) { console.warn('[coop] lost', e); }
            }, 1500);
          },
          say(text, secs) { const r = runOf(); if (r && r.ui) r.ui.toast(text, null); },
          shiny(dex) { const r = runOf(); if (r && r.ui) r.ui.toast('A shiny appeared!', 'shiny-stone'); },
          away(name) { if (name) console.warn('[coop] host away/stalled:', name); },
          mateLeft(m) {
            const r = runOf();
            if (m && m.name) showDcBanner(`${m.name} left the run`);
            if (r && r.ui && m) r.ui.toast(`${m.name || 'A player'} left`, null);
          },
          item(id) { /* TODO(no game API): no hook to give a guest a pickup by id. */ },
          pullAll() { const r = runOf(); if (r && r.pickups) r.pickups.magnetAll = 4; },
          // guest: one of the host's enemies fired (bundle patch B3). A real
          // hostile copy: on this screen it can only hurt us.
          enemyShot(row, hostSlot) {
            const r = runOf(); if (!r) return;
            const e = projectileOf(row);
            if (!e) return;
            const local = localSlotOf(hostSlot);
            e.from = local != null ? local : -1;
            r.projectiles.fire(e);
          },
          // everyone: a teammate's own shot, drawn as a harmless ghost
          ghostFire(pl, row) {
            const r = runOf(); if (!r) return;
            const e = projectileOf(row);
            if (!e) return;
            e.flags = (e.flags & ~(1 | 16 | 64)) | GHOST;
            e.dmg = 0; e.slot = -1; e.target = -1;
            r.projectiles.fire(e);
          },
          // guest: the host collected a berry / TM for us (bundle patch B4)
          heal(frac) {
            const r = runOf(); if (!r || !r.player || r.player.dead) return;
            const p = r.player;
            p.heal(p.maxHp * frac);
            r.vfx.ring(p.pos.x, p.pos.y, p.pos.z, 3, 5963658, 0.5);
          },
          item(kind) {
            // Through the bundle's own collect(): spawn it on us and take it.
            const r = runOf(); if (!r || !r.player) return;
            const p = r.player.pos, a = r.pickups.spawn(kind, p.x, p.y, p.z, 1);
            if (a != null) r.pickups.collect(a);
          },
          // host: a guest changed the team purse
          goldDelta(d) { const r = runOf(); if (r) r.gold = Math.max(0, r.gold + d); },
          // host: pickups around that guest, as [slot, kind, x, z, value]
          pickupList(m) {
            const r = runOf(); if (!r) return [];
            const pk = r.pickups, v = m && m.pl, n = v && v.net;
            const x = v && v.pos ? v.pos.x : n ? n.x : 0, z = v && v.pos ? v.pos.z : n ? n.y : 0;
            const out = [];
            for (let i = 0; i < pk.n && out.length < 250; i++) {
              if (!pk.alive[i]) continue;
              const dx = pk.x[i] - x, dz = pk.z[i] - z;
              if (dx * dx + dz * dz > PICKUP_NEAR * PICKUP_NEAR) continue;
              out.push([i, pk.kind[i], r2(pk.x[i]), r2(pk.z[i]), r2(pk.value[i])]);
            }
            return out;
          },
          syncPickups(rows) { syncPickups(runOf(), rows); },
          allyList(m) { const r = runOf(); return r ? allyList(r, m) : []; },
          // host: the boss and mini-bosses whose HP bars the HUD shows
          bossInfo() {
            const r = runOf(); if (!r) return undefined;
            const b = r.boss, sd = r.enemies, out = {};
            if (b && b.alive) out.b = [b.bossIndex, String(b.name || '').slice(0, 40), String(b.moveName || '').slice(0, 40), r2(b.moveT || 0), b.immune ? 1 : 0];
            const minis = ((r.minibosses && r.minibosses.list) || []).filter(a => a && sd.isAlive(a.i)).slice(0, 4);
            if (minis.length) out.m = minis.map(a => [a.i, String(a.name || '').slice(0, 40), String(a.kind || ''), String(a.moveName || '').slice(0, 40), r2(a.moveT || 0), r2(a.life || 0), (a.minions || []).length]);
            return out.b || out.m ? out : undefined;
          },
          syncBoss(bs) { syncBoss(runOf(), bs); },
          syncAllies(list) { syncAllies(list); },
          // host: everything else a guest sends
          guestEvent(m, ev) {
            const r = runOf(); if (!r) return;
            switch (ev[0]) {
              case 'vx':
                vfxIn(r, ev[1], ev[2], 0);
                if (Array.isArray(ev[2])) r.coop.emitNear(['vx', ev[1], ev[2]], ev[2][0], ev[2][2], m.uid, 60);
                break;
              case 'ia': {
                const it = r.interactables && r.interactables.list.find(i => near(i, ev[1], ev[2], ev[3], 2));
                if (it) r.interactables.interact(it);
                break;
              }
              case 'bd': if (ev[1] && typeof ev[1] === 'object') m.build = ev[1]; break;
            }
          },
          // guest: everything else the host sends
          hostEvent(ev) {
            const r = runOf(); if (!r) return;
            switch (ev[0]) {
              case 'vx': vfxIn(r, ev[1], ev[2], num(ev[3], 0, 0, 1e6)); break;
              case 'iu': case 'i+': case 'i-': worldEvent(r, ev); break;
              case 'rb': restoreBuild(r, ev[1]); break;
              case 'ic': {
                const it = r.interactables && r.interactables.list.find(i => near(i, 'altar', ev[1], ev[2]));
                if (it && !it.used) it.charge = num(ev[3], 0, 0, 1);
                break;
              }
              case 'bless':
                if (r.state !== 'over' && typeof r.offerBlessing === 'function') {
                  try { r.offerBlessing(String(ev[1] || ''), ev[2] | 0, ev[3] | 0, ev[4] | 0); } catch (e) { console.warn('[coop] blessing', e); }
                }
                break;
            }
          },
          // host: a teammate that dropped is back in the run
          mateBack(m) {
            const r = runOf(); if (!r) return;
            buildPuppets(r);
            hideDcBanner();
            if (m.build) r.coop.toMate(m.uid, ['rb', m.build]);
            if (r.ui) r.ui.toast(`${m.name || 'A teammate'} is back`, null);
          },
          // `Coop.onHostFrame` closes the local card whenever a frame arrives with
          // no `lu` field. On the guest that is EVERY frame (the card is opened by
          // the 'lu' event, not by a frame field), so reporting `modal` here made
          // the guest's card vanish one frame after it opened — unusable. The
          // guest's card is closed by the host's explicit 'lr' (adapter.resume),
          // so `inLevelUp()` must be false for guests.
          inLevelUp() {
            const r = runOf();
            if (!r) return false;
            if (r.coop && !r.coop.isHost) return false;   // guest: closed only by 'lr'
            return r.state === 'modal';
          },
          choosing() { const r = runOf(); return r && r.state === 'modal' ? 1 : 0; },
          watching() { return ''; },
          startCoop(msg) {
            const r = runOf();
            if (!r || !msg || msg.seed == null) return;
            // Only reseed when the host's seed actually differs: `start` is
            // broadcast once, but it also reaches the net layer used by
            // __pbStartCoop, so an unconditional rebuild would run twice and
            // replace the player object after coop.local was already re-pointed.
            if (r.seed === msg.seed) return;
            r.seed = msg.seed;
            try { r.buildStage(true); } catch (e) { console.warn('[coop] reseed', e); }
            buildPuppets(r);
          }
        };
      }

      /**
       * Level-up card closed (bundle patch A6). Tells the session, then says
       * whether the run must stay paused: with more cards queued we go on to the
       * next one; otherwise we wait for the teammates still choosing (host: its
       * `waiting` set; guest: the host's 'lr'). A guest never waits forever: if
       * 'lr' got lost, it lets itself go after HOLD_MAX.
       */
      const HOLD_MAX = 45000;
      function levelPicked(run) {
        const coop = run.coop;
        coop.localPicked();
        if (run.pendingLevels > 0) return false;
        const others = coop.isHost ? coop.waiting.size > 0 : true;
        if (!others) return false;
        R.holding = true;
        // Paused behind a real window: DC.update drops a 'modal' state that has
        // no modal open after 1.5 s ("modal state without a window").
        run.state = 'modal';
        showWaitPanel(run);
        clearTimeout(R.holdTimer);
        if (!coop.isHost) R.holdTimer = setTimeout(() => { if (R.holding && R.run === run) release(run); }, HOLD_MAX);
        return true;
      }
      globalThis.__pbLevelPicked = levelPicked;

      function release(run) {
        R.holding = false;
        R.waitEl = null;
        clearTimeout(R.holdTimer);
        if (run.state !== 'modal') return;
        if (run.pendingLevels > 0) { run.ui.hideModal(); run.state = 'play'; }   // next card opens next frame
        else run.resume();                                                         // also hides the panel
      }

      /** "Waiting for: …" window shown while teammates are still on their card. */
      function showWaitPanel(run) {
        const names = R.waitNames && R.waitNames.length ? R.waitNames.join(', ') : 'your teammates';
        if (R.waitEl && R.waitEl.isConnected) { R.waitEl.querySelector('p').textContent = names; return; }
        const el = document.createElement('div');
        el.className = 'panel pb-wait-panel';
        el.style.cssText = 'padding:18px 26px;text-align:center;max-width:420px';
        const h = document.createElement('h2');
        h.style.margin = '0 0 6px';
        h.textContent = 'Waiting for teammates…';
        const p = document.createElement('p');
        p.className = 'muted';
        p.style.margin = '0';
        p.textContent = names;
        el.append(h, p);
        R.waitEl = el;
        run.ui.modal(el);
      }

      // Begin the co-op session against a live run. `cfg` is the room ticket from
      // __pbStartCoop; the authoritative seed is the run's own seed (host) or the
      // host's `start` message (guest, captured below in __pbStartCoop).
      function beginCoop(cfg) {
        const run = R.run;
        if (!run || run.coop) return;         // no run yet, or already begun
        R.pendingCoop = null;
        const coop = R.coop;
        run.coop = coop;
        const members = R.members.length ? R.members : (cfg.members || []);
        const isHost = cfg.uid === cfg.host;
        const seed = isHost ? run.seed : (R.remoteSeed != null ? R.remoteSeed : cfg.seed);
        // Refresh our own member entry with the species we actually play now that
        // the run exists (the lobby entry is only what was selected back then).
        // The trainer name stays: it is what the party HUD and name tags show.
        // Teammates do not depend on this: every frame carries our species
        // (P.DEX), and their puppet follows it.
        if (run.startSpecies) {
          const self = members.find(m => m.uid === cfg.uid);
          if (self) { self.dex = run.startSpecies; self.shiny = !!run.shinySkin; }
        }
        R.members = members;
        if (isHost && Net.isOpen()) Net.syncMembers(members.map(m => m.uid));
        coop.begin({ seed, host: cfg.host, members }, run.player, R.game);
        if (isHost) {
          Net.broadcast({ k: 'start', seed, host: cfg.host, members, cfg: runCfgOf(run) });
        } else if (R.remoteSeed != null && run.seed !== R.remoteSeed) {
          // Only if the guest's run was NOT built from the host's config
          // (__pbRunOverride): a late fallback, the terrain is rebuilt.
          run.seed = R.remoteSeed;
